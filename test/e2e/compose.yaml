name: cozy-e2e

x-client: &client
  image: metacubex/mihomo:v1.19.31
  command: ["-d", "/tmp/mihomo", "-f", "/work/clients/client.yaml"]
  volumes: ["work:/work:ro"]
  depends_on: [node, target]

services:
  node:
    build: {context: ../.., dockerfile: test/e2e/Dockerfile}
    command: ["cozy-node"]
    environment:
      COZY_DATA_DIR: /data
      COZY_NODE_SOCKET: /run/cozy/node.sock
      COZY_DEVICE_RELEASE: 3s
      # the test target lives on a private docker network
      COZY_ALLOW_PRIVATE: "true"
    volumes: ["run:/run/cozy", "nodedata:/data"]

  target:
    build: {context: ../.., dockerfile: test/e2e/Dockerfile}
    command: ["target"]

  client-a: *client
  client-b: *client

  driver:
    image: golang:1.27
    working_dir: /src
    command: ["sleep", "infinity"]
    volumes:
      - "../..:/src:ro"
      - "work:/work"
      - "run:/run/cozy"
      - "cozy-gomod:/go/pkg/mod"
      - "cozy-gocache:/root/.cache/go-build"

volumes:
  run: {}
  nodedata: {}
  work: {}
  cozy-gomod: {external: true}
  cozy-gocache: {external: true}
