# A demo panel with its node for the README screenshots (scripts/screens/shoot.mjs).
# Only the panel's port leaves Docker, on 127.0.0.1; the node's VPN ports stay inside.
name: cozy-screens

services:
  node:
    image: ${COZY_IMAGE:-cozy:dev}
    entrypoint: ["/usr/local/bin/cozy-node"]
    environment:
      COZY_DATA_DIR: /data/node
    volumes: ["data:/data", "run:/run/cozy"]

  panel:
    image: ${COZY_IMAGE:-cozy:dev}
    depends_on: [node]
    environment:
      COZY_DATA_DIR: /data/panel
      COZY_PANEL_LISTEN: 0.0.0.0:2053
    ports: ["127.0.0.1:2090:2053"]
    volumes: ["data:/data", "run:/run/cozy"]

volumes:
  data: {}
  run: {}
