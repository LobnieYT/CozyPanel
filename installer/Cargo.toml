[package]
name = "cozy-installer"
version = "0.0.0"
edition = "2024"
# File::try_lock (the one lock for every change to the server) is stable from 1.89.
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Installs the cozy VPN panel and manages it from the server's shell"
repository = "https://github.com/LobnieYT/CozyPanel"
publish = false

# The release version comes from the tag: COZY_VERSION=v0.3.9 at build time.
[[bin]]
name = "cozy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "2"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
